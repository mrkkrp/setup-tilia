name: 'setup-tilia'
description: 'Install Tilia, put it on PATH, and cache what it reads'
inputs:
  version:
    required: false
    description: >
      The version of Tilia to install, without a leading "v". Defaults to
      "latest", which is the newest version this action knows about rather
      than whatever is newest on GitHub, so that a run is reproducible.
    default: latest
  cache:
    required: false
    description: >
      Whether to restore and save the directories Tilia reads. Turning this
      off costs a few minutes per run on a project of any size; see the
      README for what is cached and why.
    default: true
  cache-prefix:
    required: false
    description: >
      Put in front of the cache keys this action uses. Set it to keep two
      workflows in one repository from sharing caches, or to abandon the
      caches already written.
    default: setup-tilia
outputs:
  tilia-path:
    description: 'The full path of the installed executable.'
  version:
    description: 'The version that was installed, without a leading "v".'
  cache-hit:
    description: >
      "true" if every cached directory was restored from an exact match.
runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/index.js'
  post-if: 'success()'
